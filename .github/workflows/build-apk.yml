name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Aligner les versions sur le SDK Expo
        run: npx expo install --fix || true

      - name: Générer le projet Android natif
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk NeuroVerse-AI.apk

      - name: Publier l'APK (onglet Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: NeuroVerse AI v0.1.${{ github.run_number }}
          body: APK Android à installer sur le téléphone ou la tablette.
          files: NeuroVerse-AI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NeuroVerse-AI-apk
          path: NeuroVerse-AI.apk
